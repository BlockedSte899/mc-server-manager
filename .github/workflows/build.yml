name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux bundles
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10.34.5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install system dependencies (Tauri v2)
        run: |
          sudo apt-get update
          # libayatana-appindicator3-dev Conflicts with libappindicator3-dev, so
          # only the ayatana fork is installed — it provides the same tray API.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            rpm

      - uses: dtolnay/rust-toolchain@stable

      - run: pnpm install --frozen-lockfile

      - name: Build bundles
        run: pnpm tauri build --bundles appimage deb rpm

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-linux
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  windows:
    name: Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10.34.5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - run: pnpm install --frozen-lockfile

      # Fails fast on Windows-only Rust errors (cfg(windows) code is invisible
      # to the Linux job), instead of waiting for the full frontend + bundle.
      - name: Check Rust sources
        run: cargo check --workspace --locked

      - name: Build installers (NSIS + MSI)
        run: pnpm tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

  nix:
    name: Nix package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v4

      - uses: cachix/install-nix-action@v27

      # Speeds up this job only — the GitHub Actions cache is not public.
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          cache-key: mcsm-${{ github.ref_name }}
          never-skip-cache-verification: true

      - name: Build the flake package
        run: nix build .#default

      - name: Run flake checks
        run: nix flake check --no-build

  # Public binary cache, so `nix build` on a user's machine downloads the
  # package instead of compiling it for ~10 minutes. Requires a free Cachix
  # account: create one, run `cachix use <name>`, and add the resulting
  # token as the CACHIX_AUTH_TOKEN repository secret. Skipped when unset.
  #
  # Note: `secrets` is NOT available inside a step-level `if` (that was the
  # invalid `if: ${{ secrets.CACHIX_AUTH_TOKEN != '' }}`), so the push lives in
  # its own job where a job-level `if` CAN read secrets.
  cachix:
    name: Push to Cachix
    needs: nix
    if: ${{ secrets.CACHIX_AUTH_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v4

      - uses: cachix/install-nix-action@v27

      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          cache-key: mcsm-${{ github.ref_name }}
          never-skip-cache-verification: true

      # Rebuild in this fresh runner so the store holds the derivations to push
      # (jobs don't share a store, so the `nix` job's build is not visible here).
      - name: Build the flake package
        run: nix build .#default

      - uses: cachix/cachix-action@v16
        with:
          name: mc-server-manager
          skipPush: false
          extraPushFlags: "--verbose"

  publish:
    name: Publish GitHub Release
    needs: [linux, windows, nix]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## NixOS

            ```nix
            inputs.mc-server-manager.url = "github:${{ github.repository }}/${{ github.ref_name }}";
            ```

            Then add `inputs.mc-server-manager.packages.x86_64-linux.default` to
            `environment.systemPackages`, or run it directly:

            ```bash
            nix run github:${{ github.repository }}/${{ github.ref_name }}
            ```
